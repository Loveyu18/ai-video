<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Warm Home · 室內設計 3D 導覽</title>
  <meta name="description" content="全程式生成的室內設計 3D 導覽：無模型、無貼圖、無照片，用 three.js 即時渲染。" />
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1712; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }</style>
  <script>
    // 本機開發用 node_modules；放到網站（GitHub Pages）時改從 CDN 載入，版本與 package.json 一致
    (() => {
      const local = ['localhost', '127.0.0.1'].includes(location.hostname);
      const cdn = 'https://cdn.jsdelivr.net/npm/';
      const src = local
        ? { three: './node_modules/three/', bvh: './node_modules/three-mesh-bvh/', pt: './node_modules/three-gpu-pathtracer/', vrm: './node_modules/@pixiv/three-vrm/' }
        : { three: cdn + 'three@0.160.0/', bvh: cdn + 'three-mesh-bvh@0.7.8/', pt: cdn + 'three-gpu-pathtracer@0.0.20/', vrm: cdn + '@pixiv/three-vrm@3.5.5/' };
      const map = {
        imports: {
          three: src.three + 'build/three.module.js',
          'three/addons/': src.three + 'examples/jsm/',
          'three/examples/jsm/': src.three + 'examples/jsm/',
          'three-mesh-bvh': src.bvh + 'build/index.module.js',
          'three-gpu-pathtracer': src.pt + 'build/index.module.js',
          '@pixiv/three-vrm': src.vrm + 'lib/three-vrm.module.js',
        },
      };
      const s = document.createElement('script');
      s.type = 'importmap';
      s.textContent = JSON.stringify(map);
      document.currentScript.after(s);
    })();
  </script>
</head>
<body>
  <!-- 載入畫面：第一次要下載場景程式和角色模型（約 15MB），手機網路可能要十幾秒；main.js 畫出第一格後移除 -->
  <div id="loading" style="position:fixed;inset:0;display:grid;place-items:center;color:#fff8ee;text-align:center;
    font:15px 'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;letter-spacing:.12em;line-height:2">
    <div><div style="font-size:22px;font-weight:300;letter-spacing:.35em">WARM HOME</div>載入中…<br>
      <span style="opacity:.6;font-size:12px">第一次開啟需要 10～20 秒</span></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
